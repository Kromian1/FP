<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <main>
        <h1>Регистрация</h1>
        <div>
            Уже есть аккаунт? <a href="#">Войти</a>
        </div>
        <form action="/registration" method="post">
            <div>
                <input type="text" name="company" id="company" placeholder="Название компании">
                <label for="company"></label>
            </div>
            <div>
                <input type="text" name="name" id="name" placeholder="Имя">
                <label for="name"></label>
                <input type="text" name="lastname" id="lastname" placeholder="Фамилия">
                <label for="lastname"></label>
            </div>
            <div>
                <input type="email" name="email" id="email" placeholder="E-mail" required>
                <label for="email"></label>
            </div>
            <div>
                <button type="submit">Зарегистрироваться</button>
            </div>
            <div>
                <input type="checkbox" name="terms" id="terms" value="1" required>
                <label for="terms">Я прочитал и принимаю <a href="terms">Условия использования</a></label>
            </div>
        </form>
    </main>
</body>
</html>
